<script>
    $(document).ready(function () {
        {% if site.google_scholar_stats_use_cdn %}
        var gsDataBaseUrl = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@';
        {% else %}
        var gsDataBaseUrl = 'https://raw.githubusercontent.com/{{ site.repository }}/';
        {% endif %}
        var dataUrl = gsDataBaseUrl + 'google-scholar-stats/gs_data.json';

        $.getJSON(dataUrl, function (data) {
            var totalCitation = document.getElementById('total_cit');
            if (totalCitation && data.citedby !== undefined) {
                totalCitation.textContent = data.citedby;
            }

            var citationElements = document.getElementsByClassName('show_paper_citations');
            Array.prototype.forEach.call(citationElements, function (element) {
                var paperId = element.getAttribute('data-paper-id');
                var publication = data.publications && data.publications[paperId];
                if (publication && publication.num_citations !== undefined) {
                    var badgeUrl = 'https://img.shields.io/badge/Cited%20by-' +
                        encodeURIComponent(publication.num_citations) +
                        '-9cf?logo=google-scholar&labelColor=f6f6f6&style=flat&logoColor=blue';
                    element.setAttribute('src', badgeUrl);
                    element.setAttribute('alt', 'Cited by ' + publication.num_citations);
                    element.style.display = 'inline-block';
                }
            });
        }).fail(function () {
            console.warn('Unable to load the latest Google Scholar citation data.');
        });
    });
</script>
