name: Update Google Scholar citations

on:
  workflow_dispatch:
  schedule:
    # 08:17 UTC avoids the busiest start-of-hour scheduling window.
    - cron: "17 8 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/google_scholar_crawler.yaml"
      - "google_scholar_crawler/**"

permissions:
  contents: write

concurrency:
  group: google-scholar-citations
  cancel-in-progress: false

jobs:
  update-citations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_SCHOLAR_ID: KFB6PKcAAAAJ

    steps:
      - name: Check out the website source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install crawler dependencies
        run: python -m pip install --requirement google_scholar_crawler/requirements.txt

      - name: Fetch the latest citation data
        run: python google_scholar_crawler/main.py

      - name: Publish citation data
        shell: bash
        run: |
          set -euo pipefail

          data_dir="${RUNNER_TEMP}/google-scholar-stats"
          git fetch origin google-scholar-stats
          git worktree add --detach "${data_dir}" origin/google-scholar-stats
          cp google_scholar_crawler/results/*.json "${data_dir}/"

          cd "${data_dir}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gs_data.json gs_data_shieldsio.json

          if git diff --cached --quiet; then
            echo "Google Scholar citation data is already up to date."
            exit 0
          fi

          git commit -m "Update Google Scholar citations"
          git push origin HEAD:google-scholar-stats
